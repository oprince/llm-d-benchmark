# Jekyll configuration for GitHub Pages
title: llm-d-benchmark Documentation
description: Comprehensive benchmarking framework for LLM inference deployments
baseurl: "/llm-d-benchmark"
url: "https://oprince.github.io"

# Theme
theme: jekyll-theme-cayman
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Collections
collections:
  docs:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: "docs"
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "default"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .git
  - .github
  - README.md
  - LICENSE
  - Makefile
  - "*.sh"
  - "*.py"
  - setup/
  - workload/
  - scenarios/
  - build/
  - util/
  - experimental/
  - experiments/
  - existing_stack/
  - analysis/
  - benchmark_report/
  - config_explorer/
  - deploy/

# Include
include:
  - docs/

